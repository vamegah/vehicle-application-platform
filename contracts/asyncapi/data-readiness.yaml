asyncapi: 3.0.0
info:
  title: data-readiness
  version: 1.0.0
  description: >-
    Event contract of the data-readiness bounded context (Python/FastAPI, data-platform deployable).
    data-readiness owns the canonical identity layer and publishes vehicle.identity.resolved for every
    created or changed canonical entity (Req 1.6). Other contexts receive only Canonical_IDs as
    references, never raw source identifiers (Req 1.9): the identity event carries no VIN, and every
    reference between entities is a Canonical_ID. The descriptive attributes of the canonical entity are
    included so that serializing and deserializing the event reproduces the entity (Req 1.10).
    data-readiness consumes document.text.extracted and the four ERP and MES topics; those topics are
    defined only in their own files and are referenced here with external $ref, never redefined
    (ADR-008, ADR-011). The dead-letter topics of the data-readiness consumer groups are defined here.
    There is no synchronous HTTP call between data-readiness and legacy-integration on any data path
    (ADR-024). Envelope: the base envelope of contracts/asyncapi/common/envelope.yaml, defined
    file-locally and checked in CI; trace context travels in Kafka record headers.
  x-phase: 1
  x-owner-context: data-readiness
defaultContentType: application/json
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: Apache Kafka 3.x event backbone (local dev address).
channels:
  vehicleIdentityResolved:
    address: vehicle.identity.resolved
    description: >-
      One message per created or changed canonical entity (vehicle, component instance, software
      artifact, or configuration snapshot). Partition key is "{tenantId}:{canonicalId}", so all versions
      of one entity stay ordered in one partition.
    messages:
      VehicleIdentityResolved:
        $ref: '#/components/messages/VehicleIdentityResolved'
    bindings:
      kafka:
        topic: vehicle.identity.resolved
        partitions: 12
        replicas: 1
  documentTextExtracted:
    $ref: './document.text.extracted.yaml#/channels/documentTextExtracted'
  erpMasterdataChanged:
    $ref: './erp.masterdata.changed.yaml#/channels/erpMasterdataChanged'
  erpPurchaseorderUpdated:
    $ref: './erp.purchaseorder.updated.yaml#/channels/erpPurchaseorderUpdated'
  mesWorkorderReported:
    $ref: './mes.workorder.reported.yaml#/channels/mesWorkorderReported'
  mesQualityInspectionRecorded:
    $ref: './mes.quality.inspection.recorded.yaml#/channels/mesQualityInspectionRecorded'
  auditEventRecorded:
    $ref: './audit-sink.yaml#/channels/auditEventRecorded'
  dltDataReadinessDocument:
    address: dlt.data-readiness-document
    description: Dead-letter topic of consumer group data-readiness-document (document.text.extracted).
    messages:
      DeadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
  dltDataReadinessErpMasterdata:
    address: dlt.data-readiness-erp-masterdata
    description: Dead-letter topic of consumer group data-readiness-erp-masterdata (erp.masterdata.changed).
    messages:
      DeadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
  dltDataReadinessErpPurchaseorder:
    address: dlt.data-readiness-erp-purchaseorder
    description: Dead-letter topic of consumer group data-readiness-erp-purchaseorder (erp.purchaseorder.updated).
    messages:
      DeadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
  dltDataReadinessMesWorkorder:
    address: dlt.data-readiness-mes-workorder
    description: Dead-letter topic of consumer group data-readiness-mes-workorder (mes.workorder.reported).
    messages:
      DeadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
  dltDataReadinessMesQuality:
    address: dlt.data-readiness-mes-quality
    description: Dead-letter topic of consumer group data-readiness-mes-quality (mes.quality.inspection.recorded).
    messages:
      DeadLetterRecord:
        $ref: '#/components/messages/DeadLetterRecord'
operations:
  publishVehicleIdentityResolved:
    action: send
    summary: data-readiness publishes a canonical entity change through its transactional outbox.
    channel:
      $ref: '#/channels/vehicleIdentityResolved'
    messages:
      - $ref: '#/channels/vehicleIdentityResolved/messages/VehicleIdentityResolved'
    x-owner-context: data-readiness
  consumeVehicleIdentityResolvedIntegration:
    action: receive
    summary: integration-intelligence creates or updates Dependency_Graph nodes and relationships (Req 4.1).
    channel:
      $ref: '#/channels/vehicleIdentityResolved'
    messages:
      - $ref: '#/channels/vehicleIdentityResolved/messages/VehicleIdentityResolved'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - integration-intelligence-identity
    x-owner-context: integration-intelligence
    x-dead-letter-topic: dlt.integration-intelligence-identity
  consumeVehicleIdentityResolvedConfiguration:
    action: receive
    summary: configuration-assurance evaluates a created or changed configuration snapshot (Req 7.1).
    channel:
      $ref: '#/channels/vehicleIdentityResolved'
    messages:
      - $ref: '#/channels/vehicleIdentityResolved/messages/VehicleIdentityResolved'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - configuration-assurance-identity
    x-owner-context: configuration-assurance
    x-dead-letter-topic: dlt.configuration-assurance-identity
  consumeDocumentTextExtracted:
    $ref: './document.text.extracted.yaml#/operations/consumeDocumentTextExtracted'
  consumeErpMasterdataChanged:
    $ref: './erp.masterdata.changed.yaml#/operations/consumeErpMasterdataChanged'
  consumeErpPurchaseorderUpdated:
    $ref: './erp.purchaseorder.updated.yaml#/operations/consumeErpPurchaseorderUpdated'
  consumeMesWorkorderReported:
    $ref: './mes.workorder.reported.yaml#/operations/consumeMesWorkorderReported'
  consumeMesQualityInspectionRecorded:
    $ref: './mes.quality.inspection.recorded.yaml#/operations/consumeMesQualityInspectionRecorded'
  publishAuditEventRecorded:
    action: send
    summary: >-
      data-readiness records audit events through its outbox, for example a wrong-tenant event routed to
      a dead-letter topic (Req 15.6).
    channel:
      $ref: '#/channels/auditEventRecorded'
    messages:
      - $ref: '#/channels/auditEventRecorded/messages/AuditEventRecorded'
    x-owner-context: data-readiness
  publishDltDataReadinessDocument:
    action: send
    channel:
      $ref: '#/channels/dltDataReadinessDocument'
    messages:
      - $ref: '#/channels/dltDataReadinessDocument/messages/DeadLetterRecord'
    x-owner-context: data-readiness
  publishDltDataReadinessErpMasterdata:
    action: send
    channel:
      $ref: '#/channels/dltDataReadinessErpMasterdata'
    messages:
      - $ref: '#/channels/dltDataReadinessErpMasterdata/messages/DeadLetterRecord'
    x-owner-context: data-readiness
  publishDltDataReadinessErpPurchaseorder:
    action: send
    channel:
      $ref: '#/channels/dltDataReadinessErpPurchaseorder'
    messages:
      - $ref: '#/channels/dltDataReadinessErpPurchaseorder/messages/DeadLetterRecord'
    x-owner-context: data-readiness
  publishDltDataReadinessMesWorkorder:
    action: send
    channel:
      $ref: '#/channels/dltDataReadinessMesWorkorder'
    messages:
      - $ref: '#/channels/dltDataReadinessMesWorkorder/messages/DeadLetterRecord'
    x-owner-context: data-readiness
  publishDltDataReadinessMesQuality:
    action: send
    channel:
      $ref: '#/channels/dltDataReadinessMesQuality'
    messages:
      - $ref: '#/channels/dltDataReadinessMesQuality/messages/DeadLetterRecord'
    x-owner-context: data-readiness
components:
  messages:
    VehicleIdentityResolved:
      name: VehicleIdentityResolved
      title: Canonical identity resolved
      contentType: application/json
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '#/components/schemas/VehicleIdentityResolvedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            description: '"{tenantId}:{canonicalId}"'
    DeadLetterRecord:
      name: DeadLetterRecord
      title: Dead-letter record
      contentType: application/json
      payload:
        $ref: './common/dead-letter.yaml#/components/schemas/DeadLetterRecord'
      bindings:
        kafka:
          key:
            type: string
            description: The Kafka key of the original record, unchanged.
  schemas:
    KafkaHeaders:
      type: object
      required:
        - traceparent
      properties:
        traceparent:
          type: string
          description: W3C trace context.
        tracestate:
          type: string
          description: W3C trace context vendor state.
    VehicleIdentityResolvedEnvelope:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - version
        - tenantId
        - occurredAt
        - payload
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          const: vehicle.identity.resolved
        version:
          type: integer
          const: 1
        tenantId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/VehicleIdentityResolvedPayload'
    VehicleIdentityResolvedPayload:
      type: object
      additionalProperties: false
      required:
        - canonicalId
        - entityType
        - entityVersion
        - change
        - resolvedAt
        - attributes
      allOf:
        - if:
            properties:
              entityType:
                const: vehicle
          then:
            properties:
              attributes:
                $ref: '#/components/schemas/CanonicalVehicleAttributes'
        - if:
            properties:
              entityType:
                const: component-instance
          then:
            properties:
              attributes:
                $ref: '#/components/schemas/CanonicalComponentInstanceAttributes'
        - if:
            properties:
              entityType:
                const: software-artifact
          then:
            properties:
              attributes:
                $ref: '#/components/schemas/CanonicalSoftwareArtifactAttributes'
        - if:
            properties:
              entityType:
                const: configuration-snapshot
          then:
            properties:
              attributes:
                $ref: '#/components/schemas/CanonicalConfigurationSnapshotAttributes'
      properties:
        canonicalId:
          type: string
          format: uuid
          description: Canonical_ID of the entity. The partition key is "{tenantId}:{canonicalId}".
        entityType:
          type: string
          enum:
            - vehicle
            - component-instance
            - software-artifact
            - configuration-snapshot
        entityVersion:
          type: integer
          minimum: 1
          description: >-
            Monotonic version of the canonical entity. A consumer ignores an event whose entityVersion is
            not greater than the version it stored, so duplicate and out-of-order delivery converge to the
            in-order state (Req 4.4).
        change:
          type: string
          enum:
            - created
            - updated
        resolvedAt:
          type: string
          format: date-time
        attributes:
          type: object
          description: Descriptive attributes of the canonical entity; the schema depends on entityType.
    CanonicalVehicleAttributes:
      type: object
      additionalProperties: false
      description: Canonical_Vehicle (Req 1.1). The VIN is a raw source identifier and is never published.
      required:
        - modelYear
        - trim
        - plant
        - buildDate
      properties:
        modelYear:
          type: integer
          minimum: 1990
          maximum: 2100
        trim:
          type: string
          minLength: 1
          maxLength: 64
        plant:
          type: string
          minLength: 1
          maxLength: 64
        buildDate:
          type: string
          format: date
    CanonicalComponentInstanceAttributes:
      type: object
      additionalProperties: false
      description: >-
        Canonical_Component_Instance (Req 1.2). partNumber and supplierBatch are descriptive attributes;
        other contexts reference the instance only by its Canonical_ID.
      required:
        - partNumber
        - supplierBatch
      properties:
        partNumber:
          type: string
          minLength: 1
          maxLength: 64
        supplierBatch:
          type: string
          minLength: 1
          maxLength: 64
    CanonicalSoftwareArtifactAttributes:
      type: object
      additionalProperties: false
      description: >-
        Canonical_Software_Artifact (Req 1.3): an ECU, a firmware version, and a calibration ID. These are
        descriptive attributes used to label Dependency_Graph nodes; references use the Canonical_ID.
      required:
        - ecu
        - firmwareVersion
        - calibrationId
      properties:
        ecu:
          type: string
          minLength: 1
          maxLength: 64
        firmwareVersion:
          type: string
          minLength: 1
          maxLength: 64
        calibrationId:
          type: string
          minLength: 1
          maxLength: 64
    CanonicalConfigurationSnapshotAttributes:
      type: object
      additionalProperties: false
      description: >-
        Canonical_Configuration_Snapshot (Req 1.4): a vehicle, its ECU set and firmware set (as the
        Canonical_IDs of the installed software artifacts), and its regional configuration.
      required:
        - vehicleCanonicalId
        - softwareArtifactCanonicalIds
        - region
      properties:
        vehicleCanonicalId:
          type: string
          format: uuid
        softwareArtifactCanonicalIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        region:
          type: string
          minLength: 1
          maxLength: 32
