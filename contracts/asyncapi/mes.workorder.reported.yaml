asyncapi: 3.0.0
info:
  title: mes.workorder.reported
  version: 1.0.0
  description: >-
    A work order was reported in the MES source, produced by the
    legacy-integration context (Connector_Framework) after the
    Anti_Corruption_Layer has translated the legacy record, and consumed by the
    data-readiness context (ADR-011). This file owns its own payload schema; no
    ERP or MES payload schema is shared with another topic. Anti_Corruption_Layer
    note: legacy field names and codes never appear here. Every payload field is a
    stable contract field that the ACL fills from the legacy record, so a change
    in the legacy model changes the ACL mapping and not this contract. All values
    are fictional in Phase 1 seed data. There is no synchronous HTTP call in
    either direction between the two contexts. Source key strategy (ADR-016). The
    envelope carries sourceSystem, naturalKey, contentHash, extractedAt, and an
    optional sourceRecordVersion (the source-ingestion envelope in
    api-standards.md). naturalKey is built by the connector from named source
    columns (composition under the naturalKey property) and is never supplied by
    the source. contentHash is the SHA-256 (lowercase hex) of the RFC 8785
    canonical JSON form of the ACL-mapped payload object. extractedAt is set by
    the connector. The consumer idempotency key is eventId, a deterministic UUIDv5
    of (tenantId, eventType, naturalKey, contentHash, extractedAt); the consumer
    inbox keyed by (eventId, tenantId) collapses a redelivery into no additional
    effect. The connector keeps the last published contentHash per naturalKey and
    publishes nothing for an unchanged record. Ordering of versions of one record:
    use sourceRecordVersion when the event and the stored record both carry it,
    otherwise compare extractedAt; equal extractedAt is broken by the larger
    contentHash (lowercase hex, byte order), so every delivery order converges to
    one state. An event whose contentHash equals the stored contentHash is a
    no-op. A connector sets sourceRecordVersion consistently per (sourceSystem,
    topic): always or never. The envelope is defined file-locally and must equal
    the base envelope in contracts/asyncapi/common/envelope.yaml plus the
    source-ingestion extension (checked in CI). W3C trace context travels in Kafka
    record headers, not in the body.
  x-phase: 1
  x-owner-context: legacy-integration
  # Deterministic eventId (RFC 9562 UUIDv5, SHA-1), the consumer idempotency key. The name is the UTF-8 string
  # below with each field exactly as it appears in the envelope, joined with "|". The same namespace is used by
  # the four ERP and MES topics; eventType in the name keeps their IDs apart. contentHash is the SHA-256
  # (lowercase hex) of the RFC 8785 canonical JSON of payload. Checked by contracts/tests/erp_mes_rules.py.
  x-event-id:
    algorithm: uuid5
    namespace: 5aebf2d8-b259-40a3-a845-8395f935e626
    name: '{tenantId}|{eventType}|{naturalKey}|{contentHash}|{extractedAt}'
defaultContentType: application/json
servers:
  kafka:
    host: kafka:9092
    protocol: kafka
    description: Apache Kafka 3.x event backbone (local dev address).
channels:
  mesWorkorderReported:
    address: mes.workorder.reported
    description: >-
      One message per work order version. Partition key is
      "{tenantId}:{naturalKey}": the tenant and the connector-built natural key.
      All versions of one source record in one tenant stay in one partition and
      ordered. The raw natural key is used, not a hash, so the key can be
      inspected and no second hashing step can diverge between producers.
    messages:
      MesWorkorderReported:
        $ref: '#/components/messages/MesWorkorderReported'
    bindings:
      kafka:
        topic: mes.workorder.reported
        partitions: 12
        replicas: 1
operations:
  publishMesWorkorderReported:
    action: send
    summary: legacy-integration publishes an ACL-translated work order report through its transactional outbox.
    channel:
      $ref: '#/channels/mesWorkorderReported'
    messages:
      - $ref: '#/channels/mesWorkorderReported/messages/MesWorkorderReported'
    x-owner-context: legacy-integration
  consumeMesWorkorderReported:
    action: receive
    summary: data-readiness normalizes the work order, resolves vehicle and software identities, and writes to the canonical layer.
    channel:
      $ref: '#/channels/mesWorkorderReported'
    messages:
      - $ref: '#/channels/mesWorkorderReported/messages/MesWorkorderReported'
    bindings:
      kafka:
        groupId:
          type: string
          enum:
            - data-readiness-mes-workorder
    x-owner-context: data-readiness
    x-dead-letter-topic: dlt.data-readiness-mes-workorder
components:
  messages:
    MesWorkorderReported:
      name: MesWorkorderReported
      title: MES work order reported
      contentType: application/json
      headers:
        $ref: '#/components/schemas/KafkaHeaders'
      payload:
        $ref: '#/components/schemas/MesWorkorderReportedEnvelope'
      bindings:
        kafka:
          key:
            type: string
            description: '"{tenantId}:{naturalKey}"'
  schemas:
    KafkaHeaders:
      type: object
      required:
        - traceparent
      properties:
        traceparent:
          type: string
          description: W3C trace context.
        tracestate:
          type: string
          description: W3C trace context vendor state.
    MesWorkorderReportedEnvelope:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - version
        - tenantId
        - occurredAt
        - sourceSystem
        - naturalKey
        - contentHash
        - extractedAt
        - payload
      properties:
        eventId:
          type: string
          format: uuid
          description: >-
            Deterministic UUIDv5 derived from tenantId, eventType, naturalKey,
            contentHash, and extractedAt. The consumer idempotency key.
        eventType:
          type: string
          const: mes.workorder.reported
        version:
          type: integer
          const: 1
        tenantId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        sourceSystem:
          type: string
          minLength: 1
          description: >-
            Source-ingestion envelope field. The source system the record was
            extracted from (fictional in Phase 1).
        naturalKey:
          type: string
          minLength: 3
          maxLength: 512
          pattern: '^[^|]+\|[^|]+\|[^|]+$'
          description: >-
            Built by the connector from named source columns, never supplied by the
            source. Composition: <sourceSystem>|<PLANT_CD>|<WO_NO> (fictional MES columns
            mapped by the Anti_Corruption_Layer). Segments are trimmed, case-preserved,
            and percent-encoded for the characters | and %. An empty segment makes the ACL
            reject the record. The second segment equals payload.plant and the third equals payload.workOrderNumber, percent-encoded.
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            SHA-256 (lowercase hex) of the RFC 8785 canonical JSON form of the
            ACL-mapped payload object, computed by the connector. A value equal
            to the stored one means no-op.
        extractedAt:
          type: string
          format: date-time
          description: Set by the connector when it extracted the record.
        sourceRecordVersion:
          type: integer
          minimum: 1
          description: >-
            Optional. Monotonic per source record when the source provides a
            version. When present on the event and on the stored record it
            decides ordering; otherwise (extractedAt, contentHash) decides.
        payload:
          $ref: '#/components/schemas/MesWorkorderReportedPayload'
    MesWorkorderReportedPayload:
      type: object
      additionalProperties: false
      required:
        - workOrderNumber
        - plant
        - vin
        - status
        - reportedAt
      properties:
        workOrderNumber:
          type: string
          minLength: 1
          maxLength: 64
        plant:
          type: string
          minLength: 1
          maxLength: 64
        vin:
          type: string
          pattern: '^[A-HJ-NPR-Z0-9]{17}$'
          description: Source vehicle identifier (fictional). data-readiness resolves it to a Canonical_Vehicle.
        status:
          type: string
          enum:
            - released
            - in-progress
            - completed
            - rejected
        installedSoftware:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/InstalledSoftware'
        reportedAt:
          type: string
          format: date-time
    InstalledSoftware:
      type: object
      additionalProperties: false
      required:
        - ecu
        - firmwareVersion
        - calibrationId
      properties:
        ecu:
          type: string
          minLength: 1
          maxLength: 64
        firmwareVersion:
          type: string
          minLength: 1
          maxLength: 64
        calibrationId:
          type: string
          minLength: 1
          maxLength: 64
          description: Together with ecu and firmwareVersion this resolves to a Canonical_Software_Artifact.
