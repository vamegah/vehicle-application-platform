# Shared OpenAPI 3.1 components for every per-context contract in contracts/openapi/ (task 2.4).
#
# This file is not an OpenAPI document. Per-context files reference its entries with external $ref.
# It holds the API standards of api-standards.md:
#   - success envelope { data, meta { traceId, tenantId } }; list responses add meta.nextCursor;
#   - errors as RFC 9457 Problem Details (application/problem+json) with a correlationId member;
#   - cursor-only pagination (?cursor=<opaque>&limit=<int>); no offset or page parameter exists;
#   - security schemes: tenantPrincipal (the six tenant roles) and platformOperator (/admin/ only).
# The tenant ID is never a request parameter or body field on a tenant-facing route; it comes from the
# authenticated principal and is returned only in meta.tenantId (Req 12.5, 12.9).
x-phase: 1
components:
  securitySchemes:
    tenantPrincipal:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        At the API gateway, the SSO (OIDC) access token. Downstream of the gateway, the gateway-minted
        signed Internal_Principal that carries the authenticated user, roles, and the Tenant ID (Req 12.5).
        The values in an operation's security requirement are the RBAC roles allowed to call it (Req 12.8):
        release-manager, firmware-engineer, configuration-engineer, data-engineer, auditor,
        tenant-administrator. A principal with none of the listed roles gets 403 and an audit event.
    platformOperator:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Internal_Principal of the platform-operator role (Req 12.13). Not tenant-scoped and carries no
        Tenant ID. Valid only on routes whose path starts with /admin/.
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor returned as meta.nextCursor by the previous page. A malformed or expired cursor is
        rejected with 400 (Req 12.12).
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 50. A value above the maximum (200) is rejected with 400 (Req 12.12).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    CanonicalId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Platform-assigned lowercase UUID.
    TraceId:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: W3C trace ID of the request.
    Meta:
      type: object
      additionalProperties: false
      required: [traceId, tenantId]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        tenantId:
          $ref: '#/components/schemas/CanonicalId'
          description: The tenant of the authenticated principal (Req 12.9).
    ListMeta:
      type: object
      additionalProperties: false
      required: [traceId, tenantId, nextCursor]
      properties:
        traceId:
          $ref: '#/components/schemas/TraceId'
        tenantId:
          $ref: '#/components/schemas/CanonicalId'
        nextCursor:
          type: [string, 'null']
          description: Cursor of the next page, or null on the last page (Req 12.11).
    Problem:
      type: object
      description: RFC 9457 Problem Details (Req 12.10). Never contains a credential or stack trace.
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
          description: Problem type URI, for example https://errors.autoreliance.example/forbidden.
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          minLength: 1
          description: Correlation identifier shown by the web app with the error (Req 22.6).
        traceId:
          $ref: '#/components/schemas/TraceId'
        code:
          type: string
          description: Stable machine-readable error code, for example LAYOUT_CHANGE_REQUIRES_MIGRATION.
        errors:
          type: array
          description: Field-level validation errors on 400.
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                type: string
                description: JSON Pointer to the offending field or parameter.
              message:
                type: string
    Citation:
      type: object
      additionalProperties: false
      description: A stored Evidence_Item, graph entity, rule result, gap, or score that supports a conclusion (Req 18.1).
      required: [type, id]
      properties:
        type:
          type: string
          enum: [evidence-item, graph-entity, rule-result, evidence-gap, score, test-result, dependency-path]
        id:
          type: string
          minLength: 1
        label:
          type: string
          description: Human-readable label for the citation drill-down (Req 22.3).
    Citations:
      type: array
      minItems: 1
      description: At least one citation. An AI output without a citation is discarded, never returned (Req 18.4, 18.5).
      items:
        $ref: '#/components/schemas/Citation'
    DecisionSupportStatement:
      type: string
      const: >-
        Decision support only. AutoReliance AI does not certify any vehicle, component, or software;
        release decisions remain with authorized people.
      description: Shown with every AI-generated output and verdict (Req 11.6, 22.4).
    AiOutputLabels:
      type: object
      description: Labels carried by every AI-generated output (Req 6.5, 10.3, 18.6).
      required: [aiGenerated, requiresHumanReview, citations, decisionSupportStatement]
      properties:
        aiGenerated:
          type: boolean
          const: true
        estimate:
          type: boolean
          const: true
          description: Present and true on model-generated scores.
        requiresHumanReview:
          type: boolean
          const: true
        fallback:
          type: boolean
          description: True when the rule-based fallback produced the output instead of the model (Req 10.4).
        citations:
          $ref: '#/components/schemas/Citations'
        decisionSupportStatement:
          $ref: '#/components/schemas/DecisionSupportStatement'
    Health:
      type: object
      required: [status, context]
      properties:
        status:
          type: string
          enum: [up]
        context:
          type: string
          description: The bounded context that answered.
  responses:
    Problem400:
      description: Malformed request, parameter, cursor, or a limit above the maximum (Req 12.12).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: Missing or invalid token (Req 12.3).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: The principal lacks a role listed for this operation. An audit event is recorded (Req 12.4).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: >-
        Not found. Another tenant's entity returns the identical body, so the response never reveals that
        the entity exists (Req 15.4).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: The request conflicts with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: Payload larger than the configured limit.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: The service is not ready.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem504:
      description: A downstream service did not answer within the configured timeout (Req 12.7).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
