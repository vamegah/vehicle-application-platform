invalid:
  - name: failed rule without offending entities
    base: failedAfterImpact
    remove: [payload.ruleResults.0.offendingEntityCanonicalIds]
  - name: failed rule with an empty offending-entity list
    base: failedAfterImpact
    set: { payload.ruleResults.0.offendingEntityCanonicalIds: [] }
  - name: not-evaluable rule without missing data
    base: failedAfterImpact
    remove: [payload.ruleResults.1.missingData]
  - name: missing ruleSetVersion
    base: failedAfterImpact
    remove: [payload.ruleSetVersion]
  - name: unknown rule status
    base: failedAfterImpact
    set: { payload.ruleResults.2.status: skipped }
  - name: unknown rule category
    base: failedAfterImpact
    set: { payload.ruleResults.2.ruleCategory: warranty }
  - name: impact trigger without impactResultId
    base: failedAfterImpact
    remove: [payload.trigger.impactResultId]
  - name: no rule results
    base: passedOnSnapshotCreated
    set: { payload.ruleResults: [] }
