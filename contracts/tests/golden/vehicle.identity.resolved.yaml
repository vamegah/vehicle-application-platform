invalid:
  - name: raw VIN leaked into the vehicle attributes
    base: vehicle
    set: { payload.attributes.vin: FICTIONALVIN0000001 }
  - name: vehicle without buildDate
    base: vehicle
    remove: [payload.attributes.buildDate]
  - name: vehicle attributes on a software artifact
    base: softwareArtifact
    set: { payload.attributes: { modelYear: 2027, trim: X, plant: Y, buildDate: '2026-10-02' } }
  - name: snapshot referencing artifacts by a raw identifier instead of a Canonical_ID
    base: configurationSnapshot
    set: { payload.attributes.softwareArtifactCanonicalIds: [FIC-ECU-BRAKE] }
  - name: snapshot with an empty artifact set
    base: configurationSnapshot
    set: { payload.attributes.softwareArtifactCanonicalIds: [] }
  - name: unknown entity type
    base: vehicle
    set: { payload.entityType: warranty-claim }
  - name: entityVersion 0
    base: vehicle
    set: { payload.entityVersion: 0 }
  - name: missing tenantId
    base: vehicle
    remove: [tenantId]
  - name: legacy schemaVersion field
    base: vehicle
    set: { schemaVersion: 1 }
  - name: trace context in the body
    base: vehicle
    set: { traceparent: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01 }
  - name: wrong eventType
    base: vehicle
    set: { eventType: firmware.change.committed }
  - name: version 2
    base: vehicle
    set: { version: 2 }
  - name: malformed occurredAt
    base: vehicle
    set: { occurredAt: 26/11/2026 08:15 }
  - name: canonicalId is not a UUID
    base: vehicle
    set: { payload.canonicalId: VEH-1 }
