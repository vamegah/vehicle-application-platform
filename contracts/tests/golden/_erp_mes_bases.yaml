mes.workorder.reported:
  message: MesWorkorderReported
  valid:
    completed:
      eventType: mes.workorder.reported
      version: 1
      tenantId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      occurredAt: '2026-11-26T08:00:00Z'
      sourceSystem: FIC-MES
      naturalKey: FIC-MES|FIC-PLANT-01|FIC-WO-30001
      extractedAt: '2026-11-26T07:59:58Z'
      payload:
        workOrderNumber: FIC-WO-30001
        plant: FIC-PLANT-01
        vin: FCTVN000000000017
        status: completed
        installedSoftware:
          - ecu: FIC-ECU-BRAKE
            firmwareVersion: 4.3.0
            calibrationId: FIC-CAL-0099
        reportedAt: '2026-11-26T07:58:00Z'
    withRecordVersion:
      eventType: mes.workorder.reported
      version: 1
      tenantId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      occurredAt: '2026-11-26T08:00:00Z'
      sourceSystem: FIC-MES
      naturalKey: FIC-MES|FIC-PLANT-01|FIC-WO-30002
      extractedAt: '2026-11-26T07:59:58Z'
      sourceRecordVersion: 12
      payload:
        workOrderNumber: FIC-WO-30002
        plant: FIC-PLANT-01
        vin: FCTVN000000000025
        status: in-progress
        reportedAt: '2026-11-26T07:58:00Z'
  invalid:
    - name: malformed VIN (letter O is not allowed)
      base: completed
      set: { payload.vin: FCTVN00000000O017 }
    - name: VIN that is too short
      base: completed
      set: { payload.vin: FCTVN0001 }
    - name: installed software without calibrationId
      base: completed
      remove: [payload.installedSoftware.0.calibrationId]
    - name: unknown work order status
      base: completed
      set: { payload.status: paused }
