# Base events for the four ERP and MES golden files (task 2.9). Not a golden file itself (leading underscore).
# contracts/tests/build_erp_mes_golden.py computes contentHash and eventId from these and writes the golden
# files, so the golden examples always satisfy erp_mes_rules.py. All values are fictional.
erp.masterdata.changed:
  message: ErpMasterdataChanged
  valid:
    part:
      eventType: erp.masterdata.changed
      version: 1
      tenantId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      occurredAt: '2026-11-26T07:00:00Z'
      sourceSystem: FIC-ERP
      naturalKey: FIC-ERP|part|FIC-PN-000123|FIC-PLANT-01
      extractedAt: '2026-11-26T06:59:58Z'
      sourceRecordVersion: 7
      payload:
        masterDataType: part
        changeType: updated
        changedAt: '2026-11-26T06:55:00Z'
        partNumber: FIC-PN-000123
        description: FICTIONAL brake pressure sensor
        hardwareRevision: FIC-HW-B
        effectiveFrom: '2026-12-01'
    supplierWithoutRecordVersion:
      eventType: erp.masterdata.changed
      version: 1
      tenantId: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
      occurredAt: '2026-11-26T07:00:00Z'
      sourceSystem: FIC-ERP
      naturalKey: FIC-ERP|supplier|FIC-SUP-042|FIC-CO-1
      extractedAt: '2026-11-26T06:59:58Z'
      payload:
        masterDataType: supplier
        changeType: created
        changedAt: '2026-11-26T06:50:00Z'
        supplierCode: FIC-SUP-042
        description: FICTIONAL Tier-1 supplier
  invalid:
    - name: part master data without partNumber
      base: part
      remove: [payload.partNumber]
    - name: supplier master data without supplierCode
      base: supplierWithoutRecordVersion
      remove: [payload.supplierCode]
    - name: naturalKey with an unknown record kind
      base: part
      set: { naturalKey: FIC-ERP|material|FIC-PN-000123|FIC-PLANT-01 }
    - name: naturalKey with a missing segment
      base: part
      set: { naturalKey: FIC-ERP|part|FIC-PN-000123 }
