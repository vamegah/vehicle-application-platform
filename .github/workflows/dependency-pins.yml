name: dependency-pins

# Task 1.4. Runs the dependency pin check, its fixture tests, and the compatibility checks that need
# Java, Maven, and Docker (Spring Boot 4.1.3 + Cloud 2025.1.5 gateway, Jackson 3, spring-vault-core 4.1.2,
# AWS SDK checksums, jqwik and Pact on JUnit 6, kafka-clients against Kafka 3.x, Neo4j driver against
# Neo4j 5.x, and put/get/head/delete against the digest-pinned Garage image with both S3 clients).
# Versions come from DEPENDENCIES.lock.md. A skipped Docker-backed test fails the job.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.16"
      - name: Dependency pin check on the repository
        run: python scripts/check-dependency-pins
      - name: Pin check fixture tests
        run: python -m unittest discover -s scripts/tests -p "test_check_dependency_pins.py" -v

  s3-client-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install pinned verification requirements
        run: python -m pip install -r scripts/verification/python/requirements-verification.txt
      - name: boto3 client configuration and Garage put/get/head/delete
        run: |
          python -m unittest discover -s scripts/verification/python -v 2>&1 | tee boto3.log
          if grep -qiE "skipped" boto3.log; then echo "a boto3 verification test was skipped (Docker missing?)"; exit 1; fi

  java-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12.16"
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Apache Maven 3.9.16 (sha512 from DEPENDENCIES.lock.md)
        run: |
          curl -fsSLo maven.tar.gz https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            || curl -fsSLo maven.tar.gz https://downloads.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  maven.tar.gz" | sha512sum -c -
          sudo tar -xzf maven.tar.gz -C /opt
          sudo ln -sf /opt/apache-maven-3.9.16/bin/mvn /usr/local/bin/mvn
          mvn -v
      - name: Dependency smoke module (gateway, Jackson 3, Vault, S3 config, jqwik, Pact, Kafka, Neo4j, Garage)
        working-directory: scripts/verification/dependency-smoke
        run: mvn -B -ntp test
      - name: Fail if any Docker-backed or Garage test was skipped
        working-directory: scripts/verification/dependency-smoke
        run: |
          if grep -l "<skipped" target/surefire-reports/TEST-*.xml; then echo "a smoke test was skipped"; exit 1; fi
          test "$(grep -l 'GarageS3SmokeTest' target/surefire-reports/TEST-*.xml | wc -l)" -ge 1
      - name: Maven dependency:tree tests for spring-vault-core 4.1.2 (fixtures must fail)
        run: |
          python -m unittest discover -s scripts/tests -p "test_vault_dependency_tree.py" -v 2>&1 | tee vault.log
          if grep -qiE "skipped" vault.log; then echo "vault tree test skipped"; exit 1; fi
