spring:
  application:
    name: legacy-integration

# Task 1.6: this context wires its own datasource, Flyway run, and health indicator (LegacyIntegrationPersistence), so it can share
# a JVM with another context. The URL and the credential come from the environment (AUTORELIANCE_DB_LEGACY_INTEGRATION_URL and
# AUTORELIANCE_DB_LEGACY_INTEGRATION_PASSWORD; Vault from task 4.4). The role is always `legacy_integration`.
autoreliance:
  db:
    legacy_integration:
      pool-size: 5

management:
  health:
    db:
      enabled: false
  endpoint:
    health:
      group:
        legacy-integration:
          include: legacyIntegrationDatabase
