spring:
  application:
    name: configuration-assurance

# Task 1.6: this context wires its own datasource, Flyway run, and health indicator (ConfigurationAssurancePersistence), so it can share
# a JVM with another context. The URL and the credential come from the environment (AUTORELIANCE_DB_CONFIGURATION_URL and
# AUTORELIANCE_DB_CONFIGURATION_PASSWORD; Vault from task 4.4). The role is always `configuration`.
autoreliance:
  db:
    configuration:
      pool-size: 5

management:
  health:
    db:
      enabled: false
  endpoint:
    health:
      group:
        configuration-assurance:
          include: configurationDatabase
