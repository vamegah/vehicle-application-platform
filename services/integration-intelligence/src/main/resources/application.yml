spring:
  application:
    name: integration-intelligence

# Task 1.6: this context wires its own datasource, Flyway run, and health indicator (IntegrationIntelligencePersistence), so it can share
# a JVM with another context. The URL and the credential come from the environment (AUTORELIANCE_DB_INTEGRATION_URL and
# AUTORELIANCE_DB_INTEGRATION_PASSWORD; Vault from task 4.4). The role is always `integration`.
autoreliance:
  db:
    integration:
      pool-size: 5

management:
  health:
    db:
      enabled: false
  endpoint:
    health:
      group:
        integration-intelligence:
          include: integrationDatabase
