# Alembic configuration of the data-readiness context (task 1.5).
# The database location and the credential are never in this file: migrations/env.py reads them from the
# environment (DATA_READINESS_DB_URL without credentials, DATA_READINESS_DB_PASSWORD; Vault from task 4.4) and
# connects as the data_readiness login role only.
#
#   alembic upgrade head      (run in services/data-readiness/)

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
