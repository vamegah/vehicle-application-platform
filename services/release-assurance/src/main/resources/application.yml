spring:
  application:
    name: release-assurance

# Task 1.6: this context wires its own datasource, Flyway run, and health indicator (ReleaseAssurancePersistence), so it can share
# a JVM with another context. The URL and the credential come from the environment (AUTORELIANCE_DB_RELEASE_URL and
# AUTORELIANCE_DB_RELEASE_PASSWORD; Vault from task 4.4). The role is always `release`.
autoreliance:
  db:
    release:
      pool-size: 5

management:
  health:
    db:
      enabled: false
  endpoint:
    health:
      group:
        release-assurance:
          include: releaseDatabase
