spring:
  application:
    name: audit-sink

# Task 1.6: this context wires its own datasource, Flyway run, and health indicator (AuditSinkPersistence), so it can share
# a JVM with another context. The URL and the credential come from the environment (AUTORELIANCE_DB_AUDIT_URL and
# AUTORELIANCE_DB_AUDIT_PASSWORD; Vault from task 4.4). The role is always `audit`.
autoreliance:
  db:
    audit:
      pool-size: 5

management:
  health:
    db:
      enabled: false
  endpoint:
    health:
      group:
        audit-sink:
          include: auditDatabase
