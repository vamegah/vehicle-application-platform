# Prometheus for local development (task 1.2). Dashboards and service scrape targets come with task 16.1.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
